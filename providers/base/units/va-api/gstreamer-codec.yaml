  - executable.name == 'gst-launch-1.0'
  - vaapi_codec.profile_id in ('6', '7', '13') and vaapi_codec.entrypoint_id in ('6', '8')
user: root
summary: gstreamer VAAPI hardware encode to H264 1080p video
