  - GST_PLUGIN_PATH
estimated_duration: 1m
command: gstreamer_hw_codec_test.py encode av1/bbb_sunflower_1080p_30fps_normal_AV1.mkv --encoder vaapih264enc --parser h264parse --muxer mp4mux --output-container mp4 --profile '(6|7|13)' --entrypoint '(6|8)'
