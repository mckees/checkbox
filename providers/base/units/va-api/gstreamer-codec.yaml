  - from com.canonical.certification import va-api/vainfo as va_vainfo
requires:
  - executable.name == 'gst-launch-1.0'
  - package.name == 'gstreamer1.0-libav'
  - va_vainfo.profile_name in ('VAProfileH264Main', 'VAProfileH264High', 'VAProfileH264ConstrainedBaseline') and va_vainfo.direction == 'encoder'
user: root
summary: gstreamer VAAPI hardware encode to H264 1080p video
environ:
  - MEDIA_SAMPLES_PATH
  - LIBVA_DRIVER_NAME
