# GStreamer VAAPI hardware video decode/encode tests.
# Sample media files are provided by the media-samples snap; set
# MEDIA_SAMPLES_PATH to override the default snap mount location.
#
# These tests use the DRM render node directly (headless), so they gate
# on their own render-node VA-API check rather than the display-based
# va-api/va-initialize job.
unit: job
plugin: shell
id: va-api/gstreamer_hw_vaapi_device
category_id: va-api
summary: Check VA-API is usable on the DRM render node for gstreamer tests
purpose:
 Confirms the VA-API driver loads on the DRM render node (the headless
 path the gstreamer hardware codec tests use) before running them.
imports:
  - from com.canonical.plainbox import manifest
requires:
  - executable.name == 'gst-launch-1.0'
  - executable.name == 'vainfo'
  - cpuinfo.platform == 'x86_64'
  - manifest.has_va_api == 'True'
user: root
environ:
  - VAAPI_DEVICE
  - LIBVA_DRIVER_NAME
estimated_duration: 5s
command: |
  if [ -n "${VAAPI_DEVICE:-}" ]; then
    set -- --device "$VAAPI_DEVICE"
  fi
  if vainfo --display drm "$@"; then
    echo "PASS: VA-API usable on ${VAAPI_DEVICE:-the default render node}"
  else
    echo "FAIL: vainfo could not initialise VA-API on ${VAAPI_DEVICE:-the default render node}"
    exit 1
  fi
---
