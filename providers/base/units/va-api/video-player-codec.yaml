# Desktop video player VAAPI hardware video decode tests.
# Sample media files are provided by the media-samples snap; set
# MEDIA_SAMPLES_PATH to override the default snap mount location.
#
# Totem (the default video player up to Ubuntu 24.04) and Showtime (the
# default from Ubuntu 26.04) both play media with GStreamer, so they reuse
# the gstreamer decode samples. Jobs for a player only run when it is
# installed. MJPEG is not covered: GStreamer ships the VA-API JPEG decoder
# with no rank, so stock players never pick it.
#
# The players need a desktop (Wayland or X11) session and run as the normal
# user inside it. They are single instance applications, so make sure the
# player is not already running.
#
# Which codec jobs run is decided by the DUT manifest: each job requires the
# has_<profile>_decoder entry for the codec it plays, so a device that is
# expected to hardware-decode a codec fails (rather than silently skips) if
# the player does not use the hardware decoder for it.
id: va-api/totem_hw_decode_av1_1080p_mkv
depends:
  - setup/install_media_samples
category_id: va-api
flags:
  - simple
imports:
  - from com.canonical.plainbox import manifest
requires:
  - executable.name == 'totem'
  - desktop_session.desktop_session == 'True'
  - manifest.has_av1_profile0_decoder == 'True'
summary: Totem VAAPI hardware decode of AV1 1080p video
environ:
  - MEDIA_SAMPLES_PATH
  - LIBVA_DRIVER_NAME
  - DISPLAY
  - WAYLAND_DISPLAY
  - XDG_RUNTIME_DIR
  - XDG_SESSION_TYPE
  - DBUS_SESSION_BUS_ADDRESS
estimated_duration: 40s
command: video_player_hw_codec_test.py totem av1/bbb_sunflower_1080p_30fps_normal_AV1.mkv --profile 32
siblings:
  - id: va-api/totem_hw_decode_av1_1080p_webm
