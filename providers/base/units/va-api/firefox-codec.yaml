# Firefox VAAPI hardware video decode tests.
# Sample media files are provided by the media-samples snap; set
# MEDIA_SAMPLES_PATH to override the default snap mount location.
#
# Firefox only uses VA-API inside a desktop session (not --headless or
# Xvfb). Jobs are gated on the manifest so an expected HW codec fails
# rather than skips.
id: va-api/firefox_hw_decode_av1_180p_mp4
depends:
  - setup/install_media_samples
category_id: va-api
flags:
  - simple
imports:
  - from com.canonical.plainbox import manifest
requires:
  - snap.name == 'firefox'
  - desktop_session.desktop_session == 'True'
  - manifest.has_av1_profile0_decoder == 'True'
summary: Firefox VAAPI hardware decode of AV1 180p video
environ:
  - MEDIA_SAMPLES_PATH
  - LIBVA_DRIVER_NAME
  - DISPLAY
  - WAYLAND_DISPLAY
  - XDG_RUNTIME_DIR
  - XDG_SESSION_TYPE
  - DBUS_SESSION_BUS_ADDRESS
estimated_duration: 40s
command: firefox_hw_codec_test.py av1/bbb_sunflower_180p_30fps_normal_av1.mp4
siblings:
  - id: va-api/firefox_hw_decode_av1_360p_mp4
    summary: Firefox VAAPI hardware decode of AV1 360p video
    command: firefox_hw_codec_test.py av1/bbb_sunflower_360p_30fps_normal_av1.mp4
    requires:
      - snap.name == 'firefox'
      - desktop_session.desktop_session == 'True'
      - manifest.has_av1_profile0_decoder == 'True'
  - id: va-api/firefox_hw_decode_av1_480p_mp4
    summary: Firefox VAAPI hardware decode of AV1 480p video
    command: firefox_hw_codec_test.py av1/bbb_sunflower_480p_30fps_normal_av1.mp4
    requires:
      - snap.name == 'firefox'
      - desktop_session.desktop_session == 'True'
